name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Lint, tipos y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

      # Las pruebas de packages/db corren contra el Postgres local de Supabase.
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      # `supabase start` aplica las migraciones y los seeds desde cero. Sus puertos
      # (54321-54324) caen en el rango efímero de Linux y a veces el runner ya tiene
      # uno ocupado: se reintenta.
      - name: supabase start
        run: |
          for intento in 1 2 3; do
            if supabase start; then exit 0; fi
            supabase stop --no-backup || true
            sleep 5
          done
          exit 1

      - run: pnpm test

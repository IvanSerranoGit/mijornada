# Configuración del proyecto de Supabase en producción (mijornada, us-east-1).
# Solo declara lo que debe diferir de los valores por defecto de la nube; lo demás
# no se toca. Se revisa y aplica con:
#
#   supabase config diff --workdir infra/supabase-produccion --remote=<ref>
#   supabase config push --workdir infra/supabase-produccion --remote=<ref>
#
# (supabase/config.toml, en la raíz, es la configuración del entorno LOCAL.)
project_id = "mijornada"

[api]
# Esquemas que expone la API: los que consumen web, PWA y kiosco.
schemas = ["public", "graphql_public", "tenants", "jornada", "calculo", "cumplimiento"]

[auth]
site_url = "https://mijornada.xyz"
additional_redirect_urls = ["https://mijornada.xyz/auth/callback"]

# Agrega tenant_id, rol, usuario_id, centro_id y trabajador_id al JWT.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/tenants/claims_token_acceso"

# PROVISIONAL (piloto): la confirmación de correo está apagada porque el correo
# incluido de Supabase no entrega a direcciones externas. Volver a encenderla
# (quitar este bloque y `supabase config push`) cuando el SMTP de Resend esté
# verificado.
[auth.email]
enable_confirmations = false

# PENDIENTE (cuando el dominio esté verificado en Resend): correo de Auth por SMTP con
# las plantillas en español de ./templates. Al activarlo se quita el bloque [auth.email]
# de arriba (vuelve la confirmación de correo). La contraseña SMTP es la llave de Resend
# y se pasa por variable de entorno al hacer `config push`; nunca va en el repositorio.
#
# [auth.email]
# enable_confirmations = true
#
# [auth.email.smtp]
# enabled = true
# host = "smtp.resend.com"
# port = 465
# user = "resend"
# pass = "env(RESEND_API_KEY)"
# admin_email = "hola@mijornada.xyz"
# sender_name = "Mi Jornada"
#
# [auth.email.template.confirmation]
# subject = "Confirma tu correo en Mi Jornada"
# content_path = "./supabase/templates/confirmacion.html"
#
# [auth.email.template.magic_link]
# subject = "Tu enlace para entrar a Mi Jornada"
# content_path = "./supabase/templates/enlace-magico.html"
#
# [auth.email.template.recovery]
# subject = "Restablece tu contraseña de Mi Jornada"
# content_path = "./supabase/templates/recuperacion.html"
#
# [auth.email.template.email_change]
# subject = "Confirma tu correo nuevo en Mi Jornada"
# content_path = "./supabase/templates/cambio-de-correo.html"
